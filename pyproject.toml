[project]
name = "guitar-analytics"
version = "0.1.0"
description = "音源からギターのタブ譜を作る"
requires-python = ">=3.10,<3.12"
dependencies = ["basic-pitch==0.4.0", "numpy<2", "setuptools<70"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
guitar-tab = "guitar_analytics.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["guitar_analytics"]
