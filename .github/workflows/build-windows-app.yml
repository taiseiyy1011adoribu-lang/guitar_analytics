# Windows 用のインストーラー（setup.exe）を作る。
#
# - プルリクエスト: exe が作れて解析が動くかを確かめるだけ（できた setup.exe は Artifacts からダウンロードできる）
# - 「Actions」→「Windows アプリを作る」→「Run workflow」で版番号（例 0.2.0）を入れる、
#   または v0.2.0 のようなタグを付ける: リリースのページに setup.exe を公開する
name: Windows アプリを作る

on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "公開する版番号（例 0.2.0）。空なら公開せずにビルドだけする"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 版番号を決める
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}" }
          $v = $v.Trim().TrimStart("v")
          $publish = [bool]$v
          if (-not $v) { $v = "0.0.0-dev" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "publish=$($publish.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "version=$v publish=$publish"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-app.txt

      - name: 依存関係を入れる
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-app.txt pytest
          pip install --no-deps basic-pitch==0.4.0
          pip install --no-deps .

      - name: テスト
        run: python -m pytest -q

      - name: exe を作る
        run: pyinstaller packaging/guitar_analytics.spec --noconfirm

      - name: exe で解析できるか確かめる
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\GuitarTab\GuitarTab.exe -ArgumentList "--no-browser" `
            -NoNewWindow -PassThru -RedirectStandardOutput app-out.log -RedirectStandardError app-err.log
          try {
            $ok = $false
            for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
              Start-Sleep -Seconds 1
              try { Invoke-WebRequest http://127.0.0.1:8000/ -UseBasicParsing | Out-Null; $ok = $true } catch {}
            }
            if (-not $ok) { throw "アプリが起動しませんでした" }
            $r = Invoke-RestMethod -Method Post -InFile samples\sample.wav -ContentType application/octet-stream `
              -Uri "http://127.0.0.1:8000/api/analyze?name=sample.wav" -TimeoutSec 600
            Write-Host $r.ascii
            if ($r.events.Count -lt 5) { throw "検出した音が少なすぎます: $($r.events.Count)" }
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Get-Content app-out.log, app-err.log -ErrorAction SilentlyContinue
          }

      - name: インストーラーを作る
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup が失敗しました" }

      - uses: actions/upload-artifact@v4
        with:
          name: GuitarTab-Setup-${{ steps.ver.outputs.version }}
          path: dist/GuitarTab-Setup-*.exe
          retention-days: 14

      - name: リリースのページに公開する
        if: steps.ver.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: ギタータブ譜メーカー ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/GuitarTab-Setup-*.exe
          body: |
            ## インストールのしかた
            1. 下の「Assets」から `GuitarTab-Setup-${{ steps.ver.outputs.version }}.exe` をダウンロードします
            2. ダブルクリックしてインストールします（管理者の権限は要りません）
            3. 「PC が保護されました」と出たら「詳細情報」→「実行」を押します
            4. スタートメニューかデスクトップの「ギタータブ譜メーカー」から起動すると、ブラウザで画面が開きます

            新しい版も同じ手順で上から入れ直せます。黒い画面を閉じるとアプリが終了します。
